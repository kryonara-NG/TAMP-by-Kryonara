name: Restore exact TAMP source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Reconstruct and restore original archive
        shell: bash
        run: |
          set -euo pipefail
          cat restore-chunks/part*.txt | tr -d '\n' | base64 --decode > /tmp/tamp-original.zip
          python3 - <<'PY'
          import zipfile, os, shutil
          archive='/tmp/tamp-original.zip'
          dest='/tmp/tamp-original'
          os.makedirs(dest, exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              z.extractall(dest)
          for name in os.listdir('.'):
              if name in ('.git', '.github', 'restore-chunks'):
                  continue
              p=os.path.join('.',name)
              shutil.rmtree(p) if os.path.isdir(p) and not os.path.islink(p) else os.remove(p)
          for name in os.listdir(dest):
              src=os.path.join(dest,name); target=os.path.join('.',name)
              shutil.copytree(src,target) if os.path.isdir(src) else shutil.copy2(src,target)
          shutil.rmtree('restore-chunks')
          workflow='.github/workflows/restore-original.yml'
          if os.path.exists(workflow): os.remove(workflow)
          try: os.rmdir('.github/workflows')
          except OSError: pass
          try: os.rmdir('.github')
          except OSError: pass
          PY
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Restore exact original TAMP project source"
          git push origin HEAD:main
